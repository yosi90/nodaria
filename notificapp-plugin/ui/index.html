<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <!-- Panel de moderación de los proyectos públicos de Nodaria dentro de Notificapp (docs/roadmaps/ROADMAP_COMUNIDAD.md). -->
    <style>
      :root {
        font: 16px/1.5 system-ui, -apple-system, sans-serif;
        color-scheme: light;
        --background: #efebe2;
        --surface: #ffffff;
        --surface-soft: #f9f7f2;
        --text: #1f1d1a;
        --muted: #5c574e;
        --border: #ddd6c8;
        --accent: #5b45d6;
        --accent-text: #ffffff;
        --danger: #c3303d;
        --danger-text: #ffffff;
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
        --background: #0d0f13;
        --surface: #14171d;
        --surface-soft: #1b1f27;
        --text: #eceef3;
        --muted: #a3abba;
        --border: #282e39;
        --accent: #a194ff;
        --accent-text: #14112a;
        --danger: #ff7c87;
        --danger-text: #2a0c10;
      }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 12px 12px 28px; background: var(--background); color: var(--text); }
      main { max-width: 680px; margin: 0 auto; display: grid; gap: 12px; }
      .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px; }
      h1 { font-size: 1.15rem; margin: 0; }
      h2 { font-size: 1rem; margin: 0 0 4px; overflow-wrap: anywhere; }
      .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
      .muted { color: var(--muted); font-size: 0.9rem; }
      .badge { font-size: 0.8rem; padding: 2px 8px; border-radius: 999px; background: var(--surface-soft); border: 1px solid var(--border); }
      .badge.pendiente { border-color: var(--accent); color: var(--accent); }
      .body { white-space: pre-wrap; overflow-wrap: anywhere; margin: 8px 0; }
      button { font: inherit; padding: 9px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-soft); color: var(--text); cursor: pointer; }
      button.primary { background: var(--accent); color: var(--accent-text); border-color: transparent; }
      button.danger { background: var(--danger); color: var(--danger-text); border-color: transparent; }
      button:disabled { opacity: 0.6; cursor: default; }
      .list { display: grid; gap: 8px; }
      .item { text-align: left; width: 100%; display: grid; gap: 2px; background: var(--surface); }
      label { display: grid; gap: 4px; font-size: 0.9rem; margin-top: 10px; }
      input, textarea, select { font: inherit; padding: 9px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-soft); color: var(--text); width: 100%; }
      textarea { min-height: 80px; }
      .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
      #status { min-height: 1.5em; }
      .error { color: var(--danger); }
    </style>
  </head>
  <body>
    <main>
      <div class="card row">
        <h1>Denuncias de proyectos públicos</h1>
        <button type="button" id="refresh">Actualizar</button>
      </div>
      <div id="status" class="muted" aria-live="polite"></div>
      <section id="detail" class="card" hidden></section>
      <section id="list" class="list"></section>
    </main>
    <script>
      try {
        if (typeof Notificapp.getTheme === 'function') document.documentElement.dataset.theme = Notificapp.getTheme();
        else if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark';
      } catch (_) {}

      const pending = new Map();
      const statusEl = document.getElementById('status');
      const listEl = document.getElementById('list');
      const detailEl = document.getElementById('detail');
      const STATES = { pendiente: 'Pendiente', retirado: 'Retirado', desestimado: 'Desestimada' };
      let cases = null;

      function el(tag, props = {}, children = []) {
        const node = document.createElement(tag);
        for (const [key, value] of Object.entries(props)) {
          if (key === 'className') node.className = value;
          else if (key === 'text') node.textContent = value;
          else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
          else node.setAttribute(key, value);
        }
        for (const child of children) node.append(child);
        return node;
      }

      function call(action, id = null, payload = {}, eventExternalId = null) {
        return new Promise((resolve, reject) => {
          const requestId = `${Date.now()}-${Math.random()}`;
          pending.set(requestId, { resolve, reject });
          const message = { requestId, action, id, payload };
          if (eventExternalId) message.eventExternalId = eventExternalId;
          Notificapp.request(JSON.stringify(message));
        });
      }

      window.notificappReceive = (requestId, raw) => {
        const waiting = pending.get(requestId);
        if (!waiting) return;
        pending.delete(requestId);
        const response = JSON.parse(raw);
        if (!response.ok) return waiting.reject(new Error(response.error || 'Error'));
        const { status, data } = response.data;
        if (status >= 400) return waiting.reject(new Error((data && data.message) || `Error ${status}`));
        waiting.resolve(data);
      };

      const when = iso => new Date(iso).toLocaleString('es-ES', { dateStyle: 'medium', timeStyle: 'short' });
      const setStatus = (text, error = false) => {
        statusEl.textContent = text;
        statusEl.className = error ? 'error' : 'muted';
      };

      async function loadList() {
        setStatus('Consultando…');
        try {
          const { reports } = await call('list');
          listEl.replaceChildren(
            ...reports.map(report =>
              el('button', { type: 'button', className: 'item card', onclick: () => openReport(report.id) }, [
                el('div', { className: 'row' }, [
                  el('strong', { text: `«${report.publication.name}»` }),
                  el('span', { className: `badge ${report.state}`, text: STATES[report.state] || report.state }),
                ]),
                el('span', { className: 'muted', text: `${report.reasonName} · ${when(report.createdAt)}` }),
              ]),
            ),
          );
          setStatus(reports.length ? '' : 'No hay denuncias.');
        } catch (error) {
          setStatus(error.message, true);
        }
      }

      async function openReport(id) {
        setStatus('Consultando…');
        try {
          const { report } = await call('detail', String(id));
          renderDetail(report);
          setStatus('');
        } catch (error) {
          setStatus(error.message, true);
        }
      }

      async function loadCases() {
        if (cases) return cases;
        try {
          cases = (await call('cases')).cases || [];
        } catch (_) {
          cases = [];
        }
        return cases;
      }

      async function renderDetail(report) {
        detailEl.hidden = false;
        const p = report.publication;
        const children = [
          el('div', { className: 'row' }, [
            el('h2', { text: `«${p.name}»` }),
            el('span', { className: `badge ${report.state}`, text: STATES[report.state] || report.state }),
          ]),
          el('div', {
            className: 'muted',
            text: `${p.nodeCount} nodos · ${p.relationCount} relaciones · ${report.pendingOnPublication} denuncia(s) pendiente(s) · cuenta ${p.author}`,
          }),
          el('div', { className: 'muted', text: `Enlace: ${report.url}` }),
          el('p', { className: 'body', text: `Motivo: ${report.reasonName}\n${report.body || 'Sin más detalle.'}` }),
        ];
        if (report.state !== 'pendiente') {
          children.push(el('p', { className: 'muted', text: `Resuelta el ${when(report.resolvedAt)}${report.note ? `: ${report.note}` : ''}.` }));
          detailEl.replaceChildren(...children);
          return;
        }
        const note = el('textarea', { placeholder: 'Motivo de la decisión (lo ve la persona si se retira)' });
        const caseSelect = el('select', {}, [el('option', { value: '', text: 'Sin aviso a la cuenta' })]);
        const message = el('textarea', { placeholder: 'Mensaje del aviso a la cuenta' });
        const retire = el('button', { type: 'button', className: 'danger', text: 'Retirar el proyecto' });
        const dismiss = el('button', { type: 'button', text: 'Desestimar' });
        const busy = value => {
          retire.disabled = value;
          dismiss.disabled = value;
        };
        const externalId = `report-${report.id}`;
        retire.addEventListener('click', async () => {
          if (caseSelect.value && !message.value.trim()) return setStatus('Escribe el mensaje del aviso.', true);
          busy(true);
          try {
            const payload = { note: note.value.trim() || undefined };
            if (caseSelect.value) Object.assign(payload, { caso: caseSelect.value, mensaje: message.value.trim() });
            const result = await call('retire', String(report.id), payload, externalId);
            setStatus(result.incident && result.incident !== 'registrado' ? `Retirado; el aviso falló (${result.incident}).` : 'Retirado.');
            renderDetail(result.report);
            loadList();
          } catch (error) {
            setStatus(error.message, true);
          } finally {
            busy(false);
          }
        });
        dismiss.addEventListener('click', async () => {
          busy(true);
          try {
            const result = await call('dismiss', String(report.id), { note: note.value.trim() || undefined }, externalId);
            setStatus('Desestimada.');
            renderDetail(result.report);
            loadList();
          } catch (error) {
            setStatus(error.message, true);
          } finally {
            busy(false);
          }
        });
        children.push(
          el('label', {}, ['Nota', note]),
          el('label', {}, ['Aviso a la cuenta (escalera de la plataforma)', caseSelect]),
          el('label', {}, ['Mensaje del aviso', message]),
          el('div', { className: 'actions' }, [retire, dismiss]),
        );
        detailEl.replaceChildren(...children);
        for (const item of await loadCases())
          caseSelect.append(el('option', { value: item.clave, text: item.nombre || item.clave }));
      }

      document.getElementById('refresh').addEventListener('click', loadList);
      loadList();
      try {
        const launch = JSON.parse(Notificapp.getLaunchEvent());
        // Las APK anteriores a la 0.3.13 no traen `data`: el id va también en el externalId.
        const id = launch && ((launch.data && launch.data.report) || (/^report-(\d+)$/.exec(launch.externalId || '') || [])[1]);
        if (id) openReport(id);
      } catch (_) {}
    </script>
  </body>
</html>
